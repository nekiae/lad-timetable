# Перезапускать скрипт при сохранении файла. Учти: Streamlit перезагружает
# только app.py, а модули из src/lad/ остаются в памяти такими, какими были
# при первом импорте. После правки модуля сервер надо ПЕРЕЗАПУСТИТЬ,
# иначе получишь ImportError на функции, которой «нет» (а она есть).
[server]
runOnSave = true
headless = true

[browser]
gatherUsageStats = false

[client]
# Убирает кнопку Deploy и меню разработчика: завуч не должен их видеть.
toolbarMode = "minimal"

# ------------------------------------------------------------------ тема
#
# Монохром: чёрный, белый, серый. Цвет остаётся только за смыслом —
# нарушение нормы красное, всё сошлось зелёное. Так документ и выглядит
# документом, а не приложением.
#
# Заголовки набраны антиквой (Newsreader) — шрифт с засечками читается
# как постановление и учебник, гротеск — как стартап. Текст и таблицы —
# Geist: в цифрах и мелком кегле засечки мешают.

[theme]
font = "'Geist':https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap"
headingFont = "'Newsreader':https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["40px", "30px", "23px", "18px", "16px", "14px"]
headingFontWeights = [700, 700, 600, 600, 600, 600]
codeFontSize = "0.85rem"
baseRadius = "10px"
buttonRadius = "6px"
showWidgetBorder = true
showSidebarBorder = false
linkUnderline = true

[theme.light]
primaryColor = "#111111"
backgroundColor = "#FBFBFA"
secondaryBackgroundColor = "#FFFFFF"
codeBackgroundColor = "#F7F6F3"
textColor = "#111111"
linkColor = "#111111"
borderColor = "#EAEAEA"
grayColor = "#787774"
blueColor = "#1F6C9F"
greenColor = "#346538"
redColor = "#9F2F2D"
orangeColor = "#956400"
yellowColor = "#956400"
violetColor = "#5B4B8A"
# Подложки уведомлений. По умолчанию st.info выводится ярко-синей плашкой —
# в монохроме она бьёт по глазам сильнее самого текста. Оставляем цвет только
# там, где он несёт смысл (ошибка, успех), и приглушаем до фона документа.
blueBackgroundColor = "#F7F6F3"
blueTextColor = "#4A4945"
greenBackgroundColor = "#EDF3EC"
greenTextColor = "#346538"
redBackgroundColor = "#FDEBEC"
redTextColor = "#9F2F2D"
orangeBackgroundColor = "#FBF3DB"
orangeTextColor = "#956400"
yellowBackgroundColor = "#FBF3DB"
yellowTextColor = "#956400"
dataframeBorderColor = "#EAEAEA"
dataframeHeaderBackgroundColor = "#F7F6F3"
chartCategoricalColors = ["#111111", "#57564F", "#8A8880", "#C9C6BE", "#1F6C9F", "#346538", "#9F2F2D"]

# Чёрный сайдбар — как в референсе: инструменты отделены от документа.
[theme.light.sidebar]
backgroundColor = "#141310"
secondaryBackgroundColor = "#211F1B"
codeBackgroundColor = "#211F1B"
textColor = "#F7F6F3"
borderColor = "#2C2A26"
primaryColor = "#A5A29A"
linkColor = "#EAEAEA"

# Тёмная — тот же тёплый монохром, повёрнутый: не синеватый уголь, а
# коричневатый. Акценты приглушены до той же меры, что и в светлой:
# цвет здесь несёт смысл (нарушено / сошлось), а не украшает.
[theme.dark]
primaryColor = "#57564F"
backgroundColor = "#0F0E0C"
secondaryBackgroundColor = "#181714"
codeBackgroundColor = "#181714"
textColor = "#F7F6F3"
linkColor = "#EAEAEA"
borderColor = "#2C2A26"
grayColor = "#A5A29A"
blueColor = "#8FB6D4"
greenColor = "#8FBF9C"
redColor = "#D89A92"
orangeColor = "#D4B678"
yellowColor = "#D4B678"
violetColor = "#A79BC4"
blueBackgroundColor = "#1A1D20"
blueTextColor = "#C9C6BE"
greenBackgroundColor = "#182018"
greenTextColor = "#9FC9A9"
redBackgroundColor = "#231917"
redTextColor = "#E0AAA2"
orangeBackgroundColor = "#221D14"
orangeTextColor = "#DCC189"
yellowBackgroundColor = "#221D14"
yellowTextColor = "#DCC189"
dataframeBorderColor = "#2C2A26"
dataframeHeaderBackgroundColor = "#181714"
chartCategoricalColors = ["#F7F6F3", "#A5A29A", "#7A776F", "#57564F", "#8FB6D4", "#8FBF9C", "#D89A92"]

[theme.dark.sidebar]
backgroundColor = "#000000"
secondaryBackgroundColor = "#161618"
textColor = "#F4F4F5"
borderColor = "#27272A"
primaryColor = "#A1A1AA"
