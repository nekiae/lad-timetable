redBackgroundColor = "#2A1616"
redTextColor = "#FCA5A5"
orangeBackgroundColor = "#2A2114"
orangeTextColor = "#FCD34D"
yellowBackgroundColor = "#292315"
yellowTextColor = "#FDE68A"
